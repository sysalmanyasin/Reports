<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazal Din's Pharma Plus — Branch Hub</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#123D25">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2420;
    --muted:#5C6961;
    --faint:#8B958E;
    --paper:#F6F6F1;
    --card:#FFFFFF;
    --line:#E4E3DA;
    --green-deep:#123D25;
    --green:#2F7A4F;
    --green-tint:#E7F3EA;
    --amber:#B8770F;
    --amber-tint:#FBF1DF;
    --blue:#2A5C82;
    --blue-tint:#E9F1F7;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,61,37,0.06), 0 8px 24px -12px rgba(18,61,37,0.12);
    --shadow-lift:0 4px 10px rgba(18,61,37,0.08), 0 18px 40px -16px rgba(18,61,37,0.22);
    --focus-ring:0 0 0 3px rgba(47,122,79,0.30);
    --dur:.25s; --ease:cubic-bezier(.25,.8,.25,1);
    --sans:'Inter',sans-serif;
    --serif:'Fraunces',serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* ---- header / masthead ---- */
  .masthead{
    background:var(--green-deep);
    color:#EFF5F0;
    padding:28px 20px 34px;
    position:relative;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(560px 260px at 88% -20%, rgba(255,255,255,0.07), transparent 60%);
    pointer-events:none;
  }
  .masthead-inner{max-width:920px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9FC6AB;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  #clock{font-variant-numeric:tabular-nums;}
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px,5.2vw,40px);
    line-height:1.08;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:14.5px;
    color:#C9DED0;
    max-width:52ch;
  }
  .branch-tag{
    margin-top:18px;
    display:inline-flex;
    gap:8px;
    align-items:baseline;
    font-family:var(--mono);
    font-size:12px;
    color:#EFF5F0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    padding:6px 12px;
    border-radius:100px;
  }
  .branch-tag b{font-family:var(--sans);font-weight:600;}

  /* ---- module grid ---- */
  main{max-width:920px;margin:0 auto;padding:26px 20px 60px;}
  .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--faint);
    margin:0 0 14px;
    padding-left:2px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .card:hover, .card:focus-within{
    transform:translateY(-2px);
    box-shadow:var(--shadow-lift);
    border-color:var(--green);
  }
  .card:focus-within{outline:none;box-shadow:var(--shadow-lift), var(--focus-ring);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .icon{
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex:none;
  }
  .icon.green{background:var(--green-tint);color:var(--green-deep);}
  .icon.amber{background:var(--amber-tint);color:var(--amber);}
  .icon.blue{background:var(--blue-tint);color:var(--blue);}
  .icon.teal{background:#E3F4F1;color:#0d9488;}
  .icon.dashed{background:transparent;border:1.5px dashed var(--line);color:var(--faint);}
  .status-dot{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--green);
    background:var(--green-tint);
    padding:3px 8px;
    border-radius:100px;
    white-space:nowrap;
  }
  .card h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:19px;
    margin:2px 0 0;
  }
  .card p{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
    margin:0;
    flex:1;
  }
  .card-cta{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
    color:var(--green-deep);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card-cta svg{transition:transform var(--dur) var(--ease);}
  .card:hover .card-cta svg{transform:translateX(3px);}

  .card.placeholder{
    border-style:dashed;
    box-shadow:none;
    background:transparent;
    color:var(--faint);
    align-items:flex-start;
    cursor:default;
  }
  .card.placeholder:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .card.placeholder p{color:var(--faint);}

  footer{
    max-width:920px;margin:0 auto;padding:0 20px 40px;
    font-size:12px;color:var(--faint);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  footer code{
    font-family:var(--mono);
    background:var(--card);
    border:1px solid var(--line);
    padding:2px 6px;
    border-radius:5px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card-cta svg{transition:none;}
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="eyebrow">
      <span>Manga Mandi Branch</span>
      <span id="clock"></span>
    </div>
    <h1>Branch Operations Hub</h1>
    <div class="sub">One cover for the day's tools — checklist, stock control, and whatever comes next.</div>
    <div class="branch-tag">Today · <b id="today-date"></b></div>
  </div>
</div>

<main>
  <p class="section-label">Modules</p>
  <div class="grid" id="module-grid"></div>
</main>

<footer>
  <span>Add a module by editing the <code>MODULES</code> list in index.html</span>
  <span>Works offline · no data leaves this device</span>
</footer>

<script>
  // ---- live date/time in masthead ----
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('today-date').textContent =
      now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  }
  tick();
  setInterval(tick, 30000);

  // ---- module registry: add a new tool by adding one object here ----
  const MODULES = [
    {
      name: "Daily Check List",
      description: "Sales, stock, and sign-off report — generate, copy to Gmail, or print as PDF.",
      href: "./daily_report.html",
      icon: "✓",
      color: "green",
      status: "Ready"
    },
    {
      name: "Excess Stock Control",
      description: "Multi-branch excess inventory tracking with automatic Head Office rollup.",
      href: "./excess-stock-control.html",
      icon: "⬒",
      color: "amber",
      status: "Ready"
    },
    {
      name: "Shift Register & Closing",
      description: "Cash reconciliation, credit ledger, and daily/period closing reports.",
      href: "https://closing.duapharma.com",
      icon: "💊",
      color: "teal",
      status: "Ready",
      external: true
    },
    {
      name: "Pharma POS",
      description: "Billing terminal — invoicing, inventory, and staff sales reports.",
      href: "https://pos.duapharma.com",
      icon: "🧾",
      color: "blue",
      status: "Ready",
      external: true
    }
    // Example of how to add the next one:
    // {
    //   name: "B2B Sales Tracker",
    //   description: "One line describing what it does.",
    //   href: "./b2b-sales-tracker.html",
    //   icon: "₨",
    //   color: "blue",
    //   status: "Ready"
    // },
  ];

  const grid = document.getElementById('module-grid');

  MODULES.forEach(m => {
    const a = document.createElement('a');
    a.href = m.href;
    a.className = 'card';
    if (m.external) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
    a.innerHTML = `
      <div class="card-top">
        <div class="icon ${m.color}">${m.icon}</div>
        <div class="status-dot">${m.external ? 'Hosted ↗' : m.status}</div>
      </div>
      <h2>${m.name}</h2>
      <p>${m.description}</p>
      <div class="card-cta">
        Open
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </div>
    `;
    grid.appendChild(a);
  });

  // ---- placeholder "add module" tile ----
  const placeholder = document.createElement('div');
  placeholder.className = 'card placeholder';
  placeholder.innerHTML = `
    <div class="icon dashed">+</div>
    <h2 style="color:var(--faint);font-family:var(--serif);font-weight:600;font-size:19px;margin:2px 0 0;">Next module</h2>
    <p>Any single-file tool goes here — save it in this folder and add its details to the list.</p>
  `;
  grid.appendChild(placeholder);
</script>

</body>
</html>
