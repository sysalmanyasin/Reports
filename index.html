<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Excess Stock Control</title>
<meta name="description" content="Excess Stock Control — multi-branch excess inventory tracking with an automatic Head Office rollup. Single-file, offline, no backend required.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Excess Stock">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%231a73e8'/%3E%3Cpath d='M9 13l9-4.5 9 4.5-9 4.5z' fill='%23fff'/%3E%3Cpath d='M9 13v9l9 4.5v-9z' fill='%23cfe0fb'/%3E%3Cpath d='M27 13v9l-9 4.5v-9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..40,300..500,0..1,0" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f6f8fc;
  --surface:#ffffff;
  --surface-2:#f1f3f4;
  --surface-hover:#f1f3f4;
  --border:#e3e6eb;
  --border-soft:#edf0f4;
  --text:#202124;
  --muted:#5f6368;
  --muted-2:#80868b;
  --primary:#1a73e8;
  --primary-dark:#174ea6;
  --primary-bg:#e8f0fe;
  --excess:#c5221f;
  --excess-bg:#fce8e6;
  --retained:#188038;
  --retained-bg:#e6f4ea;
  --loose:#b06000;
  --loose-bg:#fef7e0;
  --radius:12px;
  --radius-sm:8px;
  --shadow-1:0 1px 2px rgba(60,64,67,.16), 0 1px 3px 1px rgba(60,64,67,.08);
  --shadow-2:0 2px 6px rgba(60,64,67,.18), 0 1px 12px rgba(60,64,67,.10);
  --sidebar-w:272px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter', system-ui, -apple-system, sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input, textarea, select{font-family:inherit; font-size:13.5px;}
.material-symbols-outlined{
  font-variation-settings:'opsz' 22, 'wght' 400, 'FILL' 0, 'GRAD' 0;
  font-size:20px; line-height:1; vertical-align:middle; user-select:none;
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#d3d8de; border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#bcc2c9;}

/* ---------- Shell ---------- */
.app-shell{display:flex; flex-direction:column; height:100vh;}
.topbar{
  height:60px; flex:none; display:flex; align-items:center; gap:12px;
  padding:0 18px; background:var(--surface); border-bottom:1px solid var(--border-soft);
  z-index:20;
}
.hamburger{
  display:none; border:none; background:none; padding:8px; border-radius:50%; color:var(--muted);
}
.hamburger:hover{background:var(--surface-2);}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand .mark{
  width:36px; height:36px; border-radius:10px; flex:none;
  background:linear-gradient(155deg, var(--primary), #6a3df5);
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.brand .mark .material-symbols-outlined{font-size:20px;}
.brand-text{min-width:0;}
.brand-text h1{font-size:17px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-text .sub{font-size:11px; color:var(--muted-2); margin-top:1px;}
.topbar-spacer{flex:1;}
.topbar-meta{display:flex; align-items:center; gap:16px; font-size:12px; color:var(--muted); flex:none;}
.save-indicator{display:flex; align-items:center; gap:6px;}
.save-indicator .dot{width:7px; height:7px; border-radius:50%; background:var(--retained);}
.save-indicator .material-symbols-outlined{font-size:16px; color:var(--retained);}

.layout{flex:1; display:flex; min-height:0; position:relative;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--surface); border-right:1px solid var(--border-soft);
  overflow-y:auto; padding:10px 8px 24px; transition:transform .2s ease;
}
.nav-group{margin-bottom:6px;}
.nav-group-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted-2);
  padding:14px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:12px; width:100%; border:none; background:none; text-align:left;
  padding:9px 12px; border-radius:0 20px 20px 0; color:var(--text); font-size:13.5px; font-weight:500;
  margin-bottom:1px;
}
.nav-item .material-symbols-outlined{color:var(--muted); font-size:19px; flex:none;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--primary-bg); color:var(--primary-dark); font-weight:700;}
.nav-item.active .material-symbols-outlined{color:var(--primary);}
.nav-item .label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item .data-dot{width:7px; height:7px; border-radius:50%; background:var(--border); flex:none;}
.nav-item.has-data .data-dot{background:var(--retained);}
.branch-nav-item.expanded > .nav-item{border-radius:0 20px 0 0;}
.branch-subnav{
  display:none; padding:2px 0 6px 32px; border-radius:0 0 20px 0; background:var(--surface-2);
}
.branch-nav-item.expanded .branch-subnav{display:block;}
.subnav-btn{
  display:flex; align-items:center; gap:9px; width:calc(100% - 8px); border:none; background:none; text-align:left;
  padding:7px 10px; border-radius:16px; color:var(--muted); font-size:12.5px; font-weight:500; margin:2px 0;
}
.subnav-btn .material-symbols-outlined{font-size:16px;}
.subnav-btn:hover{background:rgba(0,0,0,.04);}
.subnav-btn.active{background:var(--surface); color:var(--primary-dark); font-weight:700; box-shadow:var(--shadow-1);}
.sidebar-backdrop{display:none;}

/* ---------- Content ---------- */
.content{flex:1; overflow-y:auto; padding:22px 26px 60px;}
.content-inner{max-width:1180px; margin:0 auto;}
.view-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.view-head h2{font-size:21px;}
.view-head .view-sub{font-size:13px; color:var(--muted); margin-top:3px;}
.view-head-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:18px; margin-bottom:16px; box-shadow:var(--shadow-1);
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card-head h3{font-size:14.5px; color:var(--text);}
.card-head .hint{font-size:12px; color:var(--muted-2);}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); font-weight:700;}
.sync-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
.sync-badge .material-symbols-outlined{font-size:16px;}
.sync-badge.sync-idle, .sync-badge.sync-ok{background:#e6f4ea; color:#1a7a3c;}
.sync-badge.sync-syncing{background:var(--surface-2); color:var(--muted-2);}
.sync-badge.sync-error{background:var(--excess-bg); color:var(--excess);}
.sync-badge.sync-off{background:var(--surface-2); color:var(--muted-2);}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:9px 15px; border-radius:8px; font-size:13px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px; transition:background .12s ease, border-color .12s ease;
}
.btn .material-symbols-outlined{font-size:17px;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-dark); border-color:var(--primary-dark);}
.btn-danger{color:var(--excess); border-color:rgba(197,34,31,.35);}
.btn-danger:hover{background:var(--excess-bg);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-group{display:flex; gap:8px; flex-wrap:wrap;}

input[type=text], input[type=number], input[type=search], textarea, select{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:9px 12px; width:100%; outline:none;
}
input:focus, textarea:focus, select:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-bg);}
textarea{min-height:120px; resize:vertical; font-family:'IBM Plex Mono', monospace; font-size:12px;}
label.field-label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){.field-row{grid-template-columns:1fr;}}

.file-drop{
  border:1.5px dashed var(--border); border-radius:var(--radius-sm); padding:18px 14px;
  text-align:center; color:var(--muted); cursor:pointer; background:var(--surface-2);
  display:flex; flex-direction:column; align-items:center; gap:4px; position:relative;
}
.file-drop:hover{border-color:var(--primary); background:var(--primary-bg);}
.file-drop input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;}
.file-drop .material-symbols-outlined{font-size:24px; color:var(--muted-2); margin-bottom:2px;}
.file-drop .fd-title{font-size:13px; font-weight:700; color:var(--text);}
.file-drop .fd-sub{font-size:11.5px; color:var(--muted-2); line-height:1.4;}

/* ---------- Chips ---------- */
.chip-list{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
.chip{
  background:var(--retained-bg); color:var(--retained); border:1px solid rgba(24,128,56,.25);
  padding:6px 8px 6px 12px; border-radius:16px; font-size:12.5px; display:flex; align-items:center; gap:6px; font-weight:500;
}
.chip button{background:none; border:none; color:var(--retained); padding:2px; display:flex; border-radius:50%;}
.chip button:hover{background:rgba(24,128,56,.15);}
.chip button .material-symbols-outlined{font-size:14px;}
.add-row{display:flex; gap:8px;}
.add-row input{flex:1;}

/* ---------- Stat cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:16px;}
.stat{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px;
  border-left:4px solid var(--muted-2); box-shadow:var(--shadow-1);
}
.stat.excess{border-left-color:var(--excess);}
.stat.retained{border-left-color:var(--retained);}
.stat.loose{border-left-color:var(--loose);}
.stat.top10{border-left-color:var(--primary);}
.stat-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.stat .material-symbols-outlined{font-size:18px; color:var(--muted-2);}
.stat.excess .material-symbols-outlined{color:var(--excess);}
.stat.retained .material-symbols-outlined{color:var(--retained);}
.stat.loose .material-symbols-outlined{color:var(--loose);}
.stat.top10 .material-symbols-outlined{color:var(--primary);}
.stat .val{font-family:'IBM Plex Mono'; font-size:21px; font-weight:700; margin-top:6px;}
.stat .bar-track{height:5px; border-radius:4px; background:var(--surface-2); margin-top:10px; overflow:hidden;}
.stat .bar-fill{height:100%; border-radius:4px; background:var(--muted-2);}
.stat.excess .bar-fill{background:var(--excess);}
.stat.retained .bar-fill{background:var(--retained);}
.stat.loose .bar-fill{background:var(--loose);}
.stat.top10 .bar-fill{background:var(--primary);}

/* ---------- Composition chart (donut) ---------- */
.chart-row{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.donut{width:112px; height:112px; border-radius:50%; flex:none; position:relative;}
.donut::after{content:''; position:absolute; inset:16px; background:var(--surface); border-radius:50%;}
.donut-legend{display:flex; flex-direction:column; gap:8px; font-size:12.5px;}
.donut-legend .li{display:flex; align-items:center; gap:8px;}
.donut-legend .sw{width:10px; height:10px; border-radius:3px; flex:none;}
.donut-legend .lbl{color:var(--muted); min-width:74px;}
.donut-legend .lv{font-family:'IBM Plex Mono'; font-weight:600;}

/* mini horizontal bar comparison (HQ) */
.hbar-row{display:flex; align-items:center; gap:10px; padding:7px 0;}
.hbar-label{width:64px; flex:none; font-weight:700; font-family:'IBM Plex Mono'; font-size:12.5px;}
.hbar-track{flex:1; height:16px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.hbar-fill{height:100%; background:linear-gradient(90deg, var(--primary), #6a3df5); border-radius:5px;}
.hbar-val{width:96px; flex:none; text-align:right; font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--muted);}

/* ---------- Filter tabs ---------- */
.filter-row{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.ftab{
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  padding:7px 14px; border-radius:999px; font-size:12.5px; cursor:pointer; font-weight:600;
}
.ftab.active{color:#fff; border-color:transparent;}
.ftab[data-f="All"].active{background:#3c4043;}
.ftab[data-f="Excess"].active{background:var(--excess);}
.ftab[data-f="Retained"].active{background:var(--retained);}
.ftab[data-f="Loose"].active{background:var(--loose);}
.search-box{margin-left:auto; min-width:200px; position:relative;}
.search-box .material-symbols-outlined{position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:17px; color:var(--muted-2);}
.search-box input{padding:7px 10px 7px 32px; font-size:12.5px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-sm);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:10px 13px; background:var(--surface-2); color:var(--muted);
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  position:sticky; top:0; border-bottom:1px solid var(--border); white-space:nowrap;
}
td{padding:9px 13px; border-bottom:1px solid var(--border-soft); vertical-align:middle; white-space:nowrap;}
td.wrap{white-space:normal;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
td.num, th.num{text-align:right; font-family:'IBM Plex Mono';}
.status-pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.status-pill.Excess{background:var(--excess-bg); color:var(--excess);}
.status-pill.Retained{background:var(--retained-bg); color:var(--retained);}
.status-pill.Loose{background:var(--loose-bg); color:var(--loose);}
.empty-row td{text-align:center; color:var(--muted-2); padding:36px; white-space:normal;}
.rank-badge{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:700;}
.rank-badge.top1{background:#fef7e0; color:#b06000;}
.rank-badge.top2{background:#eceff1; color:#546e7a;}
.rank-badge.top3{background:#fbe9e7; color:#a1442b;}
tr.branch-row-hl td:first-child{font-weight:700; color:var(--primary-dark);}

/* ---------- Two column layout ---------- */
.grid-2{display:grid; grid-template-columns:1fr; gap:16px;}

.note{
  font-size:12.5px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); padding:11px 13px; margin-top:12px; line-height:1.5;
}
.note b{color:var(--text);}
.note.warn{background:var(--loose-bg); color:#7a4a00; border-color:rgba(176,96,0,.2);}
.note.warn b{color:#7a4a00;}
.note.danger{background:var(--excess-bg); color:#8a1917; border-color:rgba(197,34,31,.2);}

.topn-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.topn-row input[type=number]{width:78px; flex:none;}
.topn-presets{display:flex; gap:6px;}
.export-actions{margin-left:auto; display:flex; gap:8px;}
@media (max-width:600px){.export-actions{margin-left:0; width:100%;} .export-actions .btn{flex:1; justify-content:center;}}

.badge{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); border:1px solid var(--border); font-weight:600;}
.branch-tag{font-family:'IBM Plex Mono'; font-weight:700; font-size:11.5px; background:var(--primary-bg); color:var(--primary-dark); padding:2px 7px; border-radius:5px;}

.empty-state{padding:50px 20px; text-align:center; color:var(--muted-2);}
.empty-state .material-symbols-outlined{font-size:40px; color:var(--border); margin-bottom:10px;}
.empty-state .big{font-size:15px; color:var(--muted); font-weight:600; margin-bottom:4px;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:#202124; color:#fff;
  padding:11px 20px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.28);
  z-index:999; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.toast .material-symbols-outlined{font-size:17px; color:#8ab4f8;}

.settings-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-weight:600; font-size:13.5px;}
.settings-row .desc{font-size:12px; color:var(--muted); margin-top:2px;}
.seg-control{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; border:1px solid var(--border-soft);}
.seg-control button{border:none; background:none; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted);}
.seg-control button.active{background:var(--surface); color:var(--primary-dark); box-shadow:var(--shadow-1);}

@media (max-width:900px){
  .hamburger{display:inline-flex;}
  .sidebar{
    position:fixed; top:60px; bottom:0; left:0; z-index:30; transform:translateX(-100%);
    box-shadow:var(--shadow-2); width:82vw; max-width:320px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.open{display:block; position:fixed; inset:60px 0 0 0; background:rgba(0,0,0,.32); z-index:25;}
  .content{padding:16px 14px 60px;}
  .brand-text .sub{display:none;}
  .topbar-meta .save-label{display:none;}
}
@media (max-width:560px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .view-head{flex-direction:column;}
  .chart-row{gap:16px;}
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu"><span class="material-symbols-outlined">menu</span></button>
    <div class="brand">
      <div class="mark"><span class="material-symbols-outlined">inventory_2</span></div>
      <div class="brand-text">
        <h1>Excess Stock Control</h1>
        <div class="sub">Branch workspaces · automatic HQ rollup</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-meta">
      <button class="btn btn-sm" id="installAppBtn" style="display:none;"><span class="material-symbols-outlined">install_desktop</span><span class="save-label">Install App</span></button>
      <div class="save-indicator"><span class="material-symbols-outlined">cloud_done</span><span class="save-label">Saved on this device</span></div>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>

<script>
/* ============================================================
   CONSTANTS
============================================================ */
const BRANCHES = ["AIT","AW","BT","DEF","JT","MM","MT","SH"];
const LS_PREFIX = 'esc:';
const TOPN_COLORS = ['#b06000','#546e7a','#a1442b'];

let state = {
  view: 'branch',              // 'branch' | 'tools' | 'hq'
  toolsTab: 'catalog',         // 'catalog' | 'sync' | 'settings'
  activeBranch: 'AIT',
  branchTab: 'adjustments',    // 'retain' | 'adjustments' | 'working' | 'export'
  hqTab: 'working',            // 'retain' | 'working' | 'topn' | 'common'
  master: { byCode:{}, byName:{}, count:0, source:'base' },
  branchData: {},
  settings: { defaultTopN: 10 },
  branchFilter: 'All',
  branchSearch: '',
  hqFilter: 'All',
  hqDrillBranch: null,
  hqSearch: '',
  hqTopN: 10,
  hqBranchTopN: 10,
  commonSearch: '',
  retainMatrixSearch: '',
  sidebarOpen: false,
};

/* ============================================================
   LOCAL STORAGE
============================================================ */
function lsGet(key){
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); markSaved(); }
  catch(e){ console.error('localStorage set failed', key, e); toast('Could not save — your browser storage may be full'); }
}
function lsRemove(key){
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
}
function markSaved(){
  const el = document.getElementById('saveTimestamp');
  if(el) el.textContent = 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  touchLocalUpdatedAt();
  scheduleCloudPush();
}

function persistBranch(branch){ lsSet('branch-data:'+branch, state.branchData[branch]); }
function persistMaster(){ lsSet('master-products', state.master); }
function persistSettings(){ lsSet('settings', state.settings); }

/* ============================================================
   CLOUD SYNC (Dropbox) — token-based, auto push/pull
   The Dropbox access token is stored separately from app data/settings
   so it never gets swept into manual export/import backup files.
============================================================ */
const DROPBOX_PATH = '/excess-stock-control-backup.json';
let cloudPushTimer = null;
let cloudBusy = false;

function touchLocalUpdatedAt(){
  try{ localStorage.setItem(LS_PREFIX+'local-updated-at', new Date().toISOString()); }catch(e){}
}
function getLocalUpdatedAt(){
  try{ return localStorage.getItem(LS_PREFIX+'local-updated-at') || ''; }catch(e){ return ''; }
}
function getDropboxToken(){
  try{ return localStorage.getItem(LS_PREFIX+'dropbox-token') || ''; }catch(e){ return ''; }
}
function setDropboxToken(token){
  try{ localStorage.setItem(LS_PREFIX+'dropbox-token', token.trim()); }catch(e){}
}
function clearDropboxToken(){
  try{ localStorage.removeItem(LS_PREFIX+'dropbox-token'); }catch(e){}
}
function getLastSyncAt(){
  try{ return localStorage.getItem(LS_PREFIX+'dropbox-last-sync') || ''; }catch(e){ return ''; }
}
function setLastSyncAt(iso){
  try{ localStorage.setItem(LS_PREFIX+'dropbox-last-sync', iso); }catch(e){}
}

function buildCloudBundle(){
  return {
    app: 'excess-stock-control',
    exportedAt: getLocalUpdatedAt() || new Date().toISOString(),
    master: state.master,
    branchData: state.branchData,
    settings: state.settings,
  };
}

async function dropboxUpload(bundle){
  const token = getDropboxToken();
  if(!token) return false;
  const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/octet-stream',
      'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_PATH, mode: 'overwrite', mute: true }),
    },
    body: JSON.stringify(bundle),
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('Dropbox upload failed ('+res.status+'): '+errText.slice(0,200));
  }
  return true;
}

async function dropboxDownload(){
  const token = getDropboxToken();
  if(!token) return null;
  const res = await fetch('https://content.dropboxapi.com/2/files/download', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_PATH }),
    },
  });
  if(res.status===409){ return null; } // no backup file yet
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('Dropbox download failed ('+res.status+'): '+errText.slice(0,200));
  }
  const text = await res.text();
  try{ return JSON.parse(text); }catch(e){ return null; }
}

function scheduleCloudPush(){
  if(!getDropboxToken()) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=>{ cloudPush(true); }, 2500);
}

async function cloudPush(silent){
  const token = getDropboxToken();
  if(!token || cloudBusy) return;
  cloudBusy = true;
  updateSyncBadge('syncing');
  try{
    await dropboxUpload(buildCloudBundle());
    setLastSyncAt(new Date().toISOString());
    updateSyncBadge('ok');
    if(!silent) toast('Synced to Dropbox');
  }catch(err){
    console.error(err);
    updateSyncBadge('error');
    if(!silent) toast('Dropbox sync failed — check your token','error');
  }finally{
    cloudBusy = false;
  }
}

async function cloudPull(silent){
  const token = getDropboxToken();
  if(!token || cloudBusy) return;
  cloudBusy = true;
  updateSyncBadge('syncing');
  try{
    const bundle = await dropboxDownload();
    if(!bundle || !bundle.branchData){
      updateSyncBadge(getLastSyncAt() ? 'ok' : 'idle');
      if(!silent) toast('No backup found on Dropbox yet — try Sync now first','error');
      cloudBusy = false;
      return;
    }
    const remoteAt = bundle.exportedAt || '';
    const localAt = getLocalUpdatedAt();
    if(!silent && localAt && remoteAt && remoteAt <= localAt){
      updateSyncBadge('ok');
      toast('This device already has the latest data');
      cloudBusy = false;
      return;
    }
    if(bundle.master) state.master = bundle.master;
    BRANCHES.forEach(b=>{ state.branchData[b] = bundle.branchData[b] || emptyBranchData(); });
    if(bundle.settings) state.settings = Object.assign({defaultTopN:10}, bundle.settings);
    persistMaster(); persistSettings();
    BRANCHES.forEach(b=>persistBranch(b));
    localStorage.setItem(LS_PREFIX+'local-updated-at', remoteAt || new Date().toISOString());
    recomputeAll(true);
    setLastSyncAt(new Date().toISOString());
    updateSyncBadge('ok');
    renderApp();
    if(!silent) toast('Pulled latest data from Dropbox');
  }catch(err){
    console.error(err);
    updateSyncBadge('error');
    if(!silent) toast('Dropbox pull failed — check your token','error');
  }finally{
    cloudBusy = false;
  }
}

function updateSyncBadge(status){
  const el = document.getElementById('cloudSyncBadge');
  if(!el) return;
  const map = {
    syncing: ['sync','Syncing…'],
    ok: ['cloud_done','Synced'],
    error: ['cloud_off','Sync error'],
    idle: ['cloud','Connected'],
  };
  const [icon, label] = map[status] || map.idle;
  el.innerHTML = '<span class="material-symbols-outlined">'+icon+'</span>'+label;
  el.className = 'sync-badge sync-'+status;
}

async function initCloudSync(){
  if(!getDropboxToken()) return;
  await cloudPull(true);
}

function loadBaseCatalog(){

    let byCode={}, byName={};
    arr.forEach(p=>{

    });

}

}

/* ============================================================
   CALCULATION ENGINE — unchanged from the original spreadsheet logic.
   Do not alter the arithmetic below; only storage/rendering around it
   has been modernized.
============================================================ */
function computeRows(rawRows, master, retainSet){
  return rawRows.map(r=>{
    let entry = master.byCode[r.code] || master.byName[(r.name||'').toLowerCase()];
    let factor = (entry && entry.factor) ? entry.factor : 1;
    if(!factor || factor<=0) factor = 1;
    // ROUNDDOWN(qty/factor,0) — how many whole packs the excess quantity makes up
    const packQty = Math.floor(r.qty / factor);
    let correctedValue = 0;
    if(r.qty > 0){
      // ROUNDDOWN( (value/qty) * (packQty*factor), 0 ) — value re-priced to only the
      // portion of stock that forms whole packs. Uses Math.floor, matching Excel's
      // ROUNDDOWN (truncate toward zero), not Math.round.
      correctedValue = Math.floor((r.value / r.qty) * (packQty * factor));
    }
    let status;
    if(retainSet.has((r.name||'').trim().toLowerCase())) status = 'Retained';
    else if(packQty === 0) status = 'Loose';
    else status = 'Excess';
    const excessContribution = status==='Excess' ? correctedValue : 0;
    return { code:r.code, name:r.name, qty:r.qty, value:r.value, factor, packQty, correctedValue, status, excessContribution };
  });
}

function summarize(computed, misc, hoValue){
  // Raw total = sum of the original "Excess Stock 100 Days Value" column, before any
  // whole-pack correction. This is the spreadsheet's "HO Excess Stock value" (col B),
  // which is just the sum of the pasted/uploaded data — no manual entry required.
  const totalRawValue = computed.reduce((s,r)=>s+(r.value||0),0);
  const totalExcess = computed.filter(r=>r.status==='Excess').reduce((s,r)=>s+r.excessContribution,0);
  const totalRetained = computed.filter(r=>r.status==='Retained').reduce((s,r)=>s+r.correctedValue,0);
  // Loose Value = raw total − retained (corrected) − excess (corrected, before misc).
  // This is a residual, not a per-row sum: it captures both true loose-stock items
  // (packQty=0, so their corrected value is 0) AND the fractional remainder that gets
  // rounded away from every Excess/Retained row. Matches the source spreadsheet's
  // "Loose Qty" column (Excess Working!C = B−D−F−E, where misc cancels out).
  const totalLoose = totalRawValue - totalRetained - totalExcess;
  const top10 = computed.filter(r=>r.status==='Excess').map(r=>r.excessContribution).sort((a,b)=>b-a).slice(0,10).reduce((s,v)=>s+v,0);
  const correctedExcessStockValue = totalExcess - (misc||0);
  let variance = null;
  if(hoValue!==null && hoValue!=='' && !isNaN(hoValue)){
    // Reconciles a reported HO figure against the sum of the pasted/uploaded data.
    variance = Number(hoValue) - totalRawValue;
  }
  return { totalRawValue, totalExcess, totalRetained, totalLoose, top10, correctedExcessStockValue, variance, misc:misc||0, hoValue };
}

function recompute(branch, persist){
  const bd = state.branchData[branch];
  const retainSet = new Set(bd.retainList.map(x=>x.toLowerCase()));
  bd.computed = computeRows(bd.rawRows, state.master, retainSet);
  bd.summary = summarize(bd.computed, Number(bd.misc)||0, bd.hoValue);
  if(persist){ bd.updatedAt = new Date().toISOString(); persistBranch(branch); }
}
function recomputeAll(persist){
  BRANCHES.forEach(b=>recompute(b, persist));
}

/* ============================================================
   PARSING PASTED / UPLOADED DATA
============================================================ */
function parseDelimited(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length>0);
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  return lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,'')));
}
function detectColumns(headers){
  const lower = headers.map(h=>h.toLowerCase());
  const codeIdx = lower.findIndex(h=>h.includes('code'));
  const nameIdx = lower.findIndex(h=>h.includes('name') && !h.includes('supplier') && !h.includes('company'));
  const valueIdx = lower.findIndex(h=>h.includes('excess') && h.includes('value'));
  const qtyIdx = lower.findIndex(h=>h.includes('excess') && !h.includes('value'));
  return {
    codeIdx: codeIdx>=0?codeIdx:0,
    nameIdx: nameIdx>=0?nameIdx:1,
    qtyIdx: qtyIdx>=0?qtyIdx:2,
    valueIdx: valueIdx>=0?valueIdx:3,
    guessed: !(codeIdx>=0 && nameIdx>=0 && valueIdx>=0 && qtyIdx>=0)
  };
}
function applyDataRows(branch, rows, sourceLabel){
  if(!rows || rows.length<2){ toast('Need a header row plus at least one data row','error'); return; }
  const headers = rows[0].map(h=>String(h==null?'':h));
  const cols = detectColumns(headers);
  const dataRows = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;
    const code = String(r[cols.codeIdx]==null?'':r[cols.codeIdx]).trim();
    const name = String(r[cols.nameIdx]==null?'':r[cols.nameIdx]).trim();
    const qty = parseFloat(r[cols.qtyIdx]) || 0;
    const value = parseFloat(r[cols.valueIdx]) || 0;
    if(!code && !name) continue;
    const codeLower = code.toLowerCase();
    const nameLower = name.toLowerCase();
    if(codeLower === 'total' || nameLower === 'total' || codeLower.startsWith('total ') || nameLower.startsWith('total ')) continue;
    if(codeLower.includes('applied filter') || nameLower.includes('applied filter')) continue;
    dataRows.push({ code, name, qty, value });
  }
  const bd = state.branchData[branch];
  bd.rawRows = dataRows;
  bd.detectLine = (cols.guessed ? 'Using default column order — ' : 'Detected — ') +
    'Code: "'+headers[cols.codeIdx]+'" · Name: "'+headers[cols.nameIdx]+'" · Qty: "'+headers[cols.qtyIdx]+'" · Value: "'+headers[cols.valueIdx]+'" · '+dataRows.length+' rows'+(sourceLabel?' · from '+sourceLabel:'');
  bd.detectGuessed = cols.guessed;
  recompute(branch, true);
  toast(dataRows.length+' rows processed for '+branch+(sourceLabel?' ('+sourceLabel+')':''));
  renderApp();
}

function donutSvg(parts){
  // parts: [{value, color}]
  const total = parts.reduce((s,p)=>s+Math.max(p.value,0),0) || 1;
  let acc = 0;
  const stops = parts.map(p=>{
    const start = (acc/total)*100;
    acc += Math.max(p.value,0);
    const end = (acc/total)*100;
    return `${p.color} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
  }).join(', ');
  return `background:conic-gradient(${stops});`;
}

function renderHqRetainMatrix(){
  const q = (state.retainMatrixSearch||'').toLowerCase();
  const map = {}; // name(lower) -> {display, values:{branch:val}, total}
  BRANCHES.forEach(b=>{
    (state.branchData[b].computed||[]).forEach(r=>{
      if(r.status!=='Retained') return;
      const key = (r.name||'').trim().toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = { display:r.name, values:{}, total:0 };
      map[key].values[b] = (map[key].values[b]||0) + r.correctedValue;
      map[key].total += r.correctedValue;
    });
  });
  let entries = Object.values(map);
  if(q) entries = entries.filter(e=>e.display.toLowerCase().includes(q));
  entries.sort((a,b)=>b.total-a.total);

  const colTotals = {}; BRANCHES.forEach(b=>colTotals[b]=0);
  entries.forEach(e=>BRANCHES.forEach(b=>colTotals[b]+=(e.values[b]||0)));
  const grandTotal = entries.reduce((s,e)=>s+e.total,0);

  const bodyRows = entries.length ? entries.map(e=>`
    <tr>
      <td class="wrap">${escapeHtml(e.display)}</td>
      ${BRANCHES.map(b=>`<td class="num">${e.values[b] ? fmt(e.values[b]) : '—'}</td>`).join('')}
      <td class="num" style="font-weight:700;">${fmt(e.total)}</td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="${BRANCHES.length+2}">No retained stock found yet — process data in a branch's Adjustments tab first.</td></tr>`;
  const totalsRow = `<tr style="border-top:2px solid var(--border); font-weight:700; background:var(--surface-2);">
    <td>Total</td>${BRANCHES.map(b=>`<td class="num">${fmt(colTotals[b])}</td>`).join('')}<td class="num">${fmt(grandTotal)}</td>
  </tr>`;

  return `
    <div class="view-head"><div><h2>Consolidated Retain Stock</h2><div class="view-sub">Branch-wise matrix of retained stock value, built live from every branch's working data.</div></div>
      <div class="view-head-actions"><button class="btn" id="exportRetainMatrixXlsx"><span class="material-symbols-outlined">table_view</span>Excel</button><button class="btn" id="exportRetainMatrixPdf"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button></div>
    </div>
    <div class="card">
      <div class="filter-row"><div class="search-box" style="margin-left:0;"><span class="material-symbols-outlined">search</span><input type="text" id="retainMatrixSearch" placeholder="Search product name…" value="${escapeHtml(state.retainMatrixSearch)}"></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product Name</th>${BRANCHES.map(b=>`<th class="num">${b}</th>`).join('')}<th class="num">Total</th></tr></thead>
          <tbody>${bodyRows}${entries.length?totalsRow:''}</tbody>
        </table>
      </div>
    </div>`;
}

    const s = bd.summary || {};
    if(s.hoValue!==null && s.hoValue!==undefined && s.hoValue!==''){ totals.ho += Number(s.hoValue)||0; }
    if(s.variance!==null && s.variance!==undefined){ totals.variance += s.variance; totals.varianceCount++; }
    totals.retained += s.totalRetained||0;
    totals.loose += s.totalLoose||0;
    totals.misc += s.misc||0;
    totals.corrected += s.correctedExcessStockValue||0;
    totals.top10 += s.top10||0;
    return `<tr class="clickable" data-action="hq-drill" data-branch="${b}" style="cursor:pointer;">
      <td class="branch-tag">${b}</td>
      <td class="num">${s.hoValue!==null && s.hoValue!==undefined && s.hoValue!=='' ? fmt(s.hoValue) : '—'}</td>
      <td class="num">${s.variance!==null && s.variance!==undefined ? fmt(s.variance) : '—'}</td>
      <td class="num">${fmt(s.totalRetained)}</td>
      <td class="num">${fmt(s.totalLoose)}</td>
      <td class="num">${fmt(s.misc)}</td>
      <td class="num" style="color:var(--excess); font-weight:700;">${fmt(s.correctedExcessStockValue)}</td>
      <td class="num">${fmt(s.top10)}</td>
    </tr>`;
  }).join('');
  const totalsHtml = `<tr style="border-top:2px solid var(--border); font-weight:700; background:var(--surface-2);">
    <td>Total</td>
    <td class="num">${totals.ho?fmt(totals.ho):'—'}</td>
    <td class="num">${totals.varianceCount?fmt(totals.variance):'—'}</td>
    <td class="num">${fmt(totals.retained)}</td>
    <td class="num">${fmt(totals.loose)}</td>
    <td class="num">${fmt(totals.misc)}</td>
    <td class="num">${fmt(totals.corrected)}</td>
    <td class="num">${fmt(totals.top10)}</td>
  </tr>`;

  const barsHtml = BRANCHES.map(b=>{
    const s = state.branchData[b].summary || {};
    const v = s.correctedExcessStockValue||0;
    const pct = Math.min(100, Math.abs(v)/maxCorrected*100);
    return `<div class="hbar-row"><div class="hbar-label">${b}</div><div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;"></div></div><div class="hbar-val">${fmt(v)}</div></div>`;
  }).join('');

  let drillHtml = '';
  if(state.hqDrillBranch && state.branchData[state.hqDrillBranch]){
    const b = state.hqDrillBranch;
    const bd = state.branchData[b];
    const q = (state.hqSearch||'').toLowerCase();
    let rows = bd.computed || [];
    if(state.hqFilter!=='All') rows = rows.filter(r=>r.status===state.hqFilter);
    if(q) rows = rows.filter(r=>(r.code||'').toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q));
    rows = [...rows].sort((a,b2)=>b2.correctedValue-a.correctedValue);
    const body = rows.length ? rows.map(r=>`
      <tr><td class="mono">${escapeHtml(r.code||'')}</td><td class="wrap">${escapeHtml(r.name||'')}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.packQty)}</td><td class="num">${fmt(r.correctedValue)}</td><td><span class="status-pill ${r.status}">${r.status}</span></td></tr>
    `).join('') : '<tr class="empty-row"><td colspan="6">No rows match.</td></tr>';
    drillHtml = `
    <div class="card">
      <div class="card-head"><h3>${b} — item detail</h3><span class="hint">live data from this branch's working tab</span></div>
      <div class="filter-row">
        ${['All','Excess','Loose','Retained'].map(f=>`<button class="ftab${state.hqFilter===f?' active':''}" data-f="${f}" data-action="hq-filter">${f}</button>`).join('')}
        <div class="search-box"><span class="material-symbols-outlined">search</span><input type="text" id="hqSearchBox" placeholder="Search code or name…" value="${escapeHtml(state.hqSearch)}"></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Code</th><th>Product Name</th><th class="num">Excess Qty</th><th class="num">Pack Qty</th><th class="num">Value</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="topn-row" style="margin-top:14px;">
        <label class="field-label" style="margin:0;">Top</label>
        <input type="number" id="hqTopNInput" value="10" min="1" step="1">
        <div class="topn-presets"><button class="btn btn-sm" data-hq-topn-preset="10">10</button><button class="btn btn-sm" data-hq-topn-preset="20">20</button><button class="btn btn-sm" data-hq-topn-preset="50">50</button></div>
        <div class="export-actions"><button class="btn btn-primary" id="hqExportTopNBtn"><span class="material-symbols-outlined">table_view</span>Excel</button><button class="btn" id="hqExportTopNPdfBtn"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button></div>
      </div>
    </div>`;
  }

  return `
    <div class="view-head"><div><h2>Consolidated Excess Stock Working</h2><div class="view-sub">Updates automatically the moment any branch processes or edits its data — no snapshot loading required.</div></div>
      <div class="view-head-actions"><button class="btn" id="exportHqWorkingXlsx"><span class="material-symbols-outlined">table_view</span>Excel</button><button class="btn" id="exportHqWorkingPdf"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Corrected excess value by branch</h3></div>
      ${barsHtml}
    </div>
    <div class="card">
      <div class="table-wrap">
        <table><thead><tr><th>Branch</th><th class="num">HO Excess Value</th><th class="num">Variance</th><th class="num">Retained Value</th><th class="num">Loose Value</th><th class="num">Misc</th><th class="num">Corrected Excess Value</th><th class="num">Top 10 High Value</th></tr></thead>
        <tbody>${rowsHtml}${totalsHtml}</tbody></table>
      </div>
    </div>
    ${drillHtml}`;
}

function renderHqTopN(){
  const n = state.hqTopN;
  const all = collectAllComputed().filter(r=>r.status==='Excess').sort((a,b)=>b.correctedValue-a.correctedValue).slice(0,n);
  const rowsHtml = all.length ? all.map((r,i)=>`
    <tr><td>${rankBadge(i+1)}</td><td class="branch-tag">${r.branch}</td><td class="mono">${escapeHtml(r.code)}</td><td class="wrap">${escapeHtml(r.name)}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.packQty)}</td><td class="num">${fmt(r.correctedValue)}</td></tr>
  `).join('') : `<tr class="empty-row"><td colspan="7">No excess items found across any branch yet.</td></tr>`;
  return `
    <div class="view-head"><div><h2>Consolidated Top ${n}</h2><div class="view-sub">Highest-value excess items across all branches combined, ranked by corrected excess value.</div></div></div>
    <div class="card">
      <div class="topn-row">
        <div class="seg-control" id="hqTopNSeg">
          <button class="${n===10?'active':''}" data-n="10">Top 10</button>
          <button class="${n===20?'active':''}" data-n="20">Top 20</button>
        </div>
        <div class="export-actions">
          <button class="btn btn-primary" id="exportHqTopNXlsx"><span class="material-symbols-outlined">table_view</span>Excel</button>
          <button class="btn" id="exportHqTopNPdf"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table><thead><tr><th>#</th><th>Branch</th><th>Code</th><th>Product Name</th><th class="num">Excess Qty</th><th class="num">Pack Qty</th><th class="num">Corrected Value</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>
    </div>`;
}

function renderHqBranchTopN(){
  const n = state.hqBranchTopN;
  const sections = BRANCHES.map(b=>{
    const bd = state.branchData[b];
    const top = topExcessRows(bd.computed||[], n);
    const branchTotal = top.reduce((s,r)=>s+r.correctedValue,0);
    const rowsHtml = top.length ? top.map((r,i)=>`
      <tr><td>${rankBadge(i+1)}</td><td class="mono">${escapeHtml(r.code)}</td><td class="wrap">${escapeHtml(r.name)}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.packQty)}</td><td class="num">${fmt(r.correctedValue)}</td></tr>
    `).join('') : `<tr class="empty-row"><td colspan="6">No excess items for ${b} yet.</td></tr>`;
    return `
      <div class="card">
        <div class="card-head">
          <h3><span class="branch-tag">${b}</span> — Top ${top.length} Excess Items</h3>
          <div class="hint">Branch total: <b class="mono" style="color:var(--excess);">${fmt(branchTotal)}</b></div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>#</th><th>Code</th><th>Product Name</th><th class="num">Excess Qty</th><th class="num">Pack Qty</th><th class="num">Corrected Value</th></tr></thead>
          <tbody>${rowsHtml}</tbody></table>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="view-head"><div><h2>Branch-wise Top ${n}</h2><div class="view-sub">Each branch's own Top ${n} excess items with value, grouped branch by branch, in a single report.</div></div></div>
    <div class="card">
      <div class="topn-row">
        <div class="seg-control" id="hqBranchTopNSeg">
          <button class="${n===10?'active':''}" data-n="10">Top 10</button>
          <button class="${n===20?'active':''}" data-n="20">Top 20</button>
        </div>
        <div class="export-actions">
          <button class="btn btn-primary" id="exportHqBranchTopNXlsx"><span class="material-symbols-outlined">table_view</span>Excel</button>
          <button class="btn" id="exportHqBranchTopNPdf"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button>
        </div>
      </div>
    </div>
    ${sections}`;
}

function renderHqCommon(){
  const q = (state.commonSearch||'').toLowerCase();
  const map = {}; // key -> {display, values:{branch:val}, total, branchCount}
  BRANCHES.forEach(b=>{
    (state.branchData[b].computed||[]).forEach(r=>{
      if(r.status!=='Excess' || r.correctedValue<=0) return;
      const key = (r.name||'').trim().toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = { display:r.name, values:{}, total:0 };
      map[key].values[b] = (map[key].values[b]||0) + r.correctedValue;
    });
  });
  let entries = Object.values(map).map(e=>{
    e.branchCount = Object.keys(e.values).length;
    e.total = Object.values(e.values).reduce((s,v)=>s+v,0);
    return e;
  }).filter(e=>e.branchCount>=2);
  if(q) entries = entries.filter(e=>e.display.toLowerCase().includes(q));
  entries.sort((a,b)=>b.total-a.total);

  const bodyRows = entries.length ? entries.map(e=>`
    <tr>
      <td class="wrap">${escapeHtml(e.display)}</td>
      ${BRANCHES.map(b=>`<td class="num">${e.values[b] ? fmt(e.values[b]) : '—'}</td>`).join('')}
      <td class="num" style="font-weight:700; color:var(--excess);">${fmt(e.total)}</td>
      <td class="num">${e.branchCount}</td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="${BRANCHES.length+3}">No products appear as excess in more than one branch yet.</td></tr>`;

  return `
    <div class="view-head"><div><h2>Common Products Across Branches</h2><div class="view-sub">Products flagged Excess in two or more branches — spot chain-wide overstocking patterns.</div></div>
      <div class="view-head-actions"><button class="btn" id="exportCommonXlsx"><span class="material-symbols-outlined">table_view</span>Excel</button><button class="btn" id="exportCommonPdf"><span class="material-symbols-outlined">picture_as_pdf</span>PDF</button></div>
    </div>
    <div class="card">
      <div class="filter-row"><div class="search-box" style="margin-left:0;"><span class="material-symbols-outlined">search</span><input type="text" id="commonSearch" placeholder="Search product name…" value="${escapeHtml(state.commonSearch)}"></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product Name</th>${BRANCHES.map(b=>`<th class="num">${b}</th>`).join('')}<th class="num">Chain Total</th><th class="num"># Branches</th></tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderHqView(){
  if(state.hqTab==='retain') return renderHqRetainMatrix();
  if(state.hqTab==='topn') return renderHqTopN();
  if(state.hqTab==='branchtopn') return renderHqBranchTopN();
  if(state.hqTab==='common') return renderHqCommon();
  if(state.hqTab==='exec') return renderHqExec();
  return renderHqWorking();
}

function renderHqExec(){
  const rowsHtml = BRANCHES.map(b=>{
    const s = state.branchData[b].summary || {};
    return `<tr><td class="branch-tag">${b}</td><td class="num">${fmt(s.correctedExcessStockValue)}</td><td class="num">${fmt(s.totalRetained)}</td><td class="num">${fmt(s.totalLoose)}</td></tr>`;
  }).join('');
  const anyData = BRANCHES.some(b=>bdRowCount(b)>0);
  return `
    <div class="view-head"><div><h2>Executive Summary</h2><div class="view-sub">A single-page PDF snapshot of all 8 branches — corrected excess value, retained value, loose value, and the top items driving excess. Regenerate it fresh any time for a management meeting.</div></div>
      <div class="view-head-actions"><button class="btn btn-primary" id="exportExecPdfBtn"><span class="material-symbols-outlined">picture_as_pdf</span>Generate PDF</button></div>
    </div>
    ${!anyData ? '<div class="note warn">No branch has data processed yet — the PDF will still generate, but every figure will be zero.</div>' : ''}
    <div class="card">
      <div class="card-head"><h3>Preview — what goes into the one-pager</h3><span class="hint">live figures, same as the PDF</span></div>
      <div class="table-wrap">
        <table><thead><tr><th>Branch</th><th class="num">Corrected Excess Value</th><th class="num">Retained Value</th><th class="num">Loose Value</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>
      <div class="note" style="margin-top:14px;">The PDF also includes: consolidated KPI totals, the branch ranked highest for excess, and the top 5 highest-value excess items company-wide.</div>
    </div>`;
}

/* ============================================================
   MAIN RENDER
============================================================ */
function renderApp(){
  renderSidebar();
  const content = document.getElementById('content');
  let html;
  if(state.view==='tools'){
    html = state.toolsTab==='catalog' ? renderToolsCatalog() : state.toolsTab==='sync' ? renderToolsSync() : renderToolsSettings();
  } else if(state.view==='hq'){
    html = renderHqView();
  } else {
    html = renderBranchView();
  }
  content.innerHTML = `<div class="content-inner">${html}</div>`;
  content.scrollTop = 0;
  wireContentEvents();
}

/* ============================================================
   EVENT WIRING (delegated per-render; content is rebuilt each time)
============================================================ */
function wireContentEvents(){
  // Tools: catalog
  const masterFile = document.getElementById('masterFile');
  if(masterFile) masterFile.addEventListener('change', handleMasterFile);
  const resetCatalogBtn = document.getElementById('resetCatalogBtn');
  if(resetCatalogBtn) resetCatalogBtn.onclick = handleResetCatalog;

  // Tools: sync
  const exportAllBtn = document.getElementById('exportAllBtn');
  if(exportAllBtn) exportAllBtn.onclick = handleExportAll;
  const importAllFile = document.getElementById('importAllFile');
  if(importAllFile) importAllFile.addEventListener('change', handleImportAll);
  const dropboxConnectBtn = document.getElementById('dropboxConnectBtn');
  if(dropboxConnectBtn) dropboxConnectBtn.onclick = ()=>{
    const input = document.getElementById('dropboxTokenInput');
    const val = input ? input.value.trim() : '';
    if(!val){ toast('Paste your Dropbox access token first','error'); return; }
    setDropboxToken(val);
    toast('Connected — syncing…');
    renderApp();
    cloudPush(false);
  };
  const cloudPushBtn = document.getElementById('cloudPushBtn');
  if(cloudPushBtn) cloudPushBtn.onclick = ()=>cloudPush(false).then(renderApp);
  const cloudPullBtn = document.getElementById('cloudPullBtn');
  if(cloudPullBtn) cloudPullBtn.onclick = ()=>cloudPull(false).then(renderApp);
  const exportExecPdfBtn = document.getElementById('exportExecPdfBtn');
  if(exportExecPdfBtn) exportExecPdfBtn.onclick = ()=>{ exportExecutiveSummaryPdf(); toast('Executive summary PDF generated'); };
  const cloudDisconnectBtn = document.getElementById('cloudDisconnectBtn');
  if(cloudDisconnectBtn) cloudDisconnectBtn.onclick = ()=>{
    if(!confirm('Disconnect Dropbox Sync on this device? Your token will be removed; local data is unaffected.')) return;
    clearDropboxToken();
    toast('Disconnected from Dropbox');
    renderApp();
  };

  // Tools: settings
  const defaultTopNControl = document.getElementById('defaultTopNControl');
  if(defaultTopNControl) defaultTopNControl.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ state.settings.defaultTopN = Number(btn.dataset.n); persistSettings(); renderApp(); toast('Default Top N set to '+btn.dataset.n); };
  });
  const resetAllBtn = document.getElementById('resetAllBtn');
  if(resetAllBtn) resetAllBtn.onclick = handleResetAll;

  // Branch: retain
  const retainAddBtn = document.getElementById('retainAddBtn');
  if(retainAddBtn) retainAddBtn.onclick = addRetainItem;
  const retainInput = document.getElementById('retainInput');
  if(retainInput) retainInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addRetainItem(); }});
  document.querySelectorAll('[data-action="retain-remove"]').forEach(btn=>{
    btn.onclick = ()=>{
      const bd = state.branchData[state.activeBranch];
      bd.retainList.splice(Number(btn.dataset.idx),1);
      recompute(state.activeBranch, true);
      renderApp();
    };
  });
  const resetRetainBtn = document.getElementById('resetRetainBtn');
  if(resetRetainBtn) resetRetainBtn.onclick = ()=>{
    const bd = state.branchData[state.activeBranch];
    bd.retainList = loadBaseRetain();
    recompute(state.activeBranch, true);
    toast('Retain list reset to base ('+bd.retainList.length+' items)');
    renderApp();
  };
  const retainImportFile = document.getElementById('retainImportFile');
  if(retainImportFile) retainImportFile.addEventListener('change', handleRetainImport);

  // Branch: adjustments
  const pasteArea = document.getElementById('pasteArea');
  const processBtn = document.getElementById('processBtn');
  if(processBtn) processBtn.onclick = ()=>{
    const raw = pasteArea.value;
    if(!raw.trim()){ toast('Paste some data first','error'); return; }
    applyDataRows(state.activeBranch, parseDelimited(raw));
  };
  const clearBtn = document.getElementById('clearBtn');
  if(clearBtn) clearBtn.onclick = ()=>{
    const bd = state.branchData[state.activeBranch];
    bd.rawRows = []; bd.computed = []; bd.summary = null; bd.detectLine = '';
    persistBranch(state.activeBranch);
    renderApp();
  };
  const branchXlsxFile = document.getElementById('branchXlsxFile');
  if(branchXlsxFile) branchXlsxFile.addEventListener('change', handleBranchFile);
  const miscInput = document.getElementById('miscInput');
  if(miscInput) miscInput.addEventListener('input', e=>{
    const bd = state.branchData[state.activeBranch];
    bd.misc = Number(e.target.value)||0;
    recompute(state.activeBranch, true);
    const note = document.getElementById('varianceNote');
    if(note){
      const raw = bd.summary.totalRawValue;
      note.innerHTML = bd.summary.variance!==null ? ((Math.abs(bd.summary.variance)<1?'Matches. ':'Does not match. ')+'Reported HO value − sum of pasted rows ('+fmt(raw)+'): <b class="mono">'+fmt(bd.summary.variance)+'</b>') : ('Sum of pasted/uploaded rows: <b class="mono">'+fmt(raw)+'</b>. Optionally enter a reported HO figure below to check it matches.');
    }
  });
  const hoValueInput = document.getElementById('hoValueInput');
  if(hoValueInput) hoValueInput.addEventListener('input', e=>{
    const bd = state.branchData[state.activeBranch];
    bd.hoValue = e.target.value===''? null : Number(e.target.value);
    recompute(state.activeBranch, true);
    const note = document.getElementById('varianceNote');
    if(note){
      const raw = bd.summary.totalRawValue;
      note.innerHTML = bd.summary.variance!==null ? ((Math.abs(bd.summary.variance)<1?'Matches. ':'Does not match. ')+'Reported HO value − sum of pasted rows ('+fmt(raw)+'): <b class="mono">'+fmt(bd.summary.variance)+'</b>') : ('Sum of pasted/uploaded rows: <b class="mono">'+fmt(raw)+'</b>. Optionally enter a reported HO figure below to check it matches.');
    }
  });

  // Branch: working (filters/search)
  document.querySelectorAll('[data-action="branch-filter"]').forEach(btn=>{
    btn.onclick = ()=>{ state.branchFilter = btn.dataset.f; renderApp(); };
  });
  const branchSearchBox = document.getElementById('branchSearchBox');
  if(branchSearchBox){
    branchSearchBox.addEventListener('input', e=>{ state.branchSearch = e.target.value; renderBranchTableOnly(); });
    branchSearchBox.focus();
    branchSearchBox.setSelectionRange(branchSearchBox.value.length, branchSearchBox.value.length);
  }

  // Branch: export
  document.querySelectorAll('[data-topn-preset]').forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById('topNInput').value = btn.dataset.topnPreset; renderBranchExportTableOnly(); };
  });
  const topNInput = document.getElementById('topNInput');
  if(topNInput) topNInput.addEventListener('input', renderBranchExportTableOnly);
  const exportTopNBtn = document.getElementById('exportTopNBtn');
  if(exportTopNBtn) exportTopNBtn.onclick = ()=>{
    const bd = state.branchData[state.activeBranch];
    exportTopNExcel(bd.computed||[], state.activeBranch, readTopN('topNInput', state.settings.defaultTopN));
  };
  const exportTopNPdfBtn = document.getElementById('exportTopNPdfBtn');
  if(exportTopNPdfBtn) exportTopNPdfBtn.onclick = ()=>{
    const bd = state.branchData[state.activeBranch];
    exportTopNPdf(bd.computed||[], state.activeBranch, readTopN('topNInput', state.settings.defaultTopN));
  };

  // HQ: working
  document.querySelectorAll('[data-action="hq-drill"]').forEach(tr=>{
    tr.onclick = ()=>{ state.hqDrillBranch = tr.dataset.branch; state.hqFilter='All'; state.hqSearch=''; renderApp(); };
  });
  document.querySelectorAll('[data-action="hq-filter"]').forEach(btn=>{
    btn.onclick = ()=>{ state.hqFilter = btn.dataset.f; renderApp(); };
  });
  const hqSearchBox = document.getElementById('hqSearchBox');
  if(hqSearchBox){
    hqSearchBox.addEventListener('input', e=>{ state.hqSearch = e.target.value; renderApp(); });
  }
  document.querySelectorAll('[data-hq-topn-preset]').forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById('hqTopNInput').value = btn.dataset.hqTopnPreset; };
  });
  const hqExportTopNBtn = document.getElementById('hqExportTopNBtn');
  if(hqExportTopNBtn) hqExportTopNBtn.onclick = ()=>{
    const b = state.hqDrillBranch;
    if(!b){ toast('Pick a branch from the table first','error'); return; }
    exportTopNExcel(state.branchData[b].computed||[], b, readTopN('hqTopNInput', 10));
  };
  const hqExportTopNPdfBtn = document.getElementById('hqExportTopNPdfBtn');
  if(hqExportTopNPdfBtn) hqExportTopNPdfBtn.onclick = ()=>{
    const b = state.hqDrillBranch;
    if(!b){ toast('Pick a branch from the table first','error'); return; }
    exportTopNPdf(state.branchData[b].computed||[], b, readTopN('hqTopNInput', 10));
  };
  const exportHqWorkingXlsx = document.getElementById('exportHqWorkingXlsx');
  if(exportHqWorkingXlsx) exportHqWorkingXlsx.onclick = ()=>{
    const aoa = [['Branch','HO Excess Value','Variance','Retained Value','Loose Value','Misc','Corrected Excess Value','Top 10 High Value']];
    BRANCHES.forEach(b=>{ const s = state.branchData[b].summary || {}; aoa.push([b, s.hoValue??'', s.variance??'', s.totalRetained||0, s.totalLoose||0, s.misc||0, s.correctedExcessStockValue||0, s.top10||0]); });
    exportExcel(aoa, 'HQ Excess Working', [10,16,12,14,12,10,18,16], 'hq_excess_working_'+todayStamp()+'.xlsx');
    toast('Consolidated working exported');
  };
  const exportHqWorkingPdf = document.getElementById('exportHqWorkingPdf');
  if(exportHqWorkingPdf) exportHqWorkingPdf.onclick = ()=>{
    const body = BRANCHES.map(b=>{ const s = state.branchData[b].summary || {}; return [b, s.hoValue!=null?fmt(s.hoValue):'—', s.variance!=null?fmt(s.variance):'—', fmt(s.totalRetained), fmt(s.totalLoose), fmt(s.misc), fmt(s.correctedExcessStockValue), fmt(s.top10)]; });
    exportPdf('Consolidated Excess Stock Working', ['Branch','HO Value','Variance','Retained','Loose','Misc','Corrected Excess','Top 10'], body, 'hq_excess_working_'+todayStamp()+'.pdf');
    toast('PDF exported');
  };

  // HQ: retain matrix
  const retainMatrixSearch = document.getElementById('retainMatrixSearch');
  if(retainMatrixSearch){
    retainMatrixSearch.addEventListener('input', e=>{ state.retainMatrixSearch = e.target.value; renderApp(); });
    retainMatrixSearch.focus();
    retainMatrixSearch.setSelectionRange(retainMatrixSearch.value.length, retainMatrixSearch.value.length);
  }
  const exportRetainMatrixXlsx = document.getElementById('exportRetainMatrixXlsx');
  if(exportRetainMatrixXlsx) exportRetainMatrixXlsx.onclick = ()=>exportRetainMatrix('xlsx');
  const exportRetainMatrixPdf = document.getElementById('exportRetainMatrixPdf');
  if(exportRetainMatrixPdf) exportRetainMatrixPdf.onclick = ()=>exportRetainMatrix('pdf');

  // HQ: top N
  const hqTopNSeg = document.getElementById('hqTopNSeg');
  if(hqTopNSeg) hqTopNSeg.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ state.hqTopN = Number(btn.dataset.n); renderApp(); };
  });
  const exportHqTopNXlsx = document.getElementById('exportHqTopNXlsx');
  if(exportHqTopNXlsx) exportHqTopNXlsx.onclick = ()=>{
    const all = collectAllComputed().filter(r=>r.status==='Excess').sort((a,b)=>b.correctedValue-a.correctedValue).slice(0,state.hqTopN);
    if(!all.length){ toast('No excess items found yet','error'); return; }
    const aoa = [['Rank','Branch','Code','Product Name','Excess Qty','Pack Qty','Corrected Excess Value']];
    all.forEach((r,i)=>aoa.push([i+1, r.branch, r.code, r.name, Math.round((r.qty||0)*100)/100, r.packQty, r.correctedValue]));
    exportExcel(aoa, 'Consolidated Top '+state.hqTopN, [6,10,14,40,12,10,20], 'consolidated_top'+state.hqTopN+'_'+todayStamp()+'.xlsx');
    toast('Consolidated Top '+state.hqTopN+' exported');
  };
  const exportHqTopNPdf = document.getElementById('exportHqTopNPdf');
  if(exportHqTopNPdf) exportHqTopNPdf.onclick = ()=>{
    const all = collectAllComputed().filter(r=>r.status==='Excess').sort((a,b)=>b.correctedValue-a.correctedValue).slice(0,state.hqTopN);
    if(!all.length){ toast('No excess items found yet','error'); return; }
    const body = all.map((r,i)=>[i+1, r.branch, r.code, r.name, fmt(r.qty), fmt(r.packQty), fmt(r.correctedValue)]);
    exportPdf('Consolidated Top '+state.hqTopN+' Excess Items', ['#','Branch','Code','Product Name','Excess Qty','Pack Qty','Corrected Value'], body, 'consolidated_top'+state.hqTopN+'_'+todayStamp()+'.pdf');
    toast('PDF exported');
  };

  // HQ: branch-wise top N (each branch's own Top 10/20, grouped, one report)
  const hqBranchTopNSeg = document.getElementById('hqBranchTopNSeg');
  if(hqBranchTopNSeg) hqBranchTopNSeg.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ state.hqBranchTopN = Number(btn.dataset.n); renderApp(); };
  });
  const exportHqBranchTopNXlsx = document.getElementById('exportHqBranchTopNXlsx');
  if(exportHqBranchTopNXlsx) exportHqBranchTopNXlsx.onclick = ()=>exportBranchWiseTopNExcel(state.hqBranchTopN);
  const exportHqBranchTopNPdf = document.getElementById('exportHqBranchTopNPdf');
  if(exportHqBranchTopNPdf) exportHqBranchTopNPdf.onclick = ()=>exportBranchWiseTopNPdf(state.hqBranchTopN);

  // HQ: common products
  const commonSearch = document.getElementById('commonSearch');
  if(commonSearch){
    commonSearch.addEventListener('input', e=>{ state.commonSearch = e.target.value; renderApp(); });
    commonSearch.focus();
    commonSearch.setSelectionRange(commonSearch.value.length, commonSearch.value.length);
  }
  const exportCommonXlsx = document.getElementById('exportCommonXlsx');
  if(exportCommonXlsx) exportCommonXlsx.onclick = ()=>exportCommon('xlsx');
  const exportCommonPdf = document.getElementById('exportCommonPdf');
  if(exportCommonPdf) exportCommonPdf.onclick = ()=>exportCommon('pdf');
}

function renderBranchTableOnly(){
  // Lightweight re-render that preserves search box focus while typing.
  const body = document.getElementById('branchTableBody');
  if(!body) return;
  const bd = state.branchData[state.activeBranch];
  const q = (state.branchSearch||'').toLowerCase();
  let rows = bd.computed || [];
  if(state.branchFilter!=='All') rows = rows.filter(r=>r.status===state.branchFilter);
  if(q) rows = rows.filter(r=>r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
  rows = [...rows].sort((a,b)=>b.correctedValue-a.correctedValue);
  body.innerHTML = rows.length ? rows.map(r=>`
    <tr><td class="mono">${escapeHtml(r.code)}</td><td class="wrap">${escapeHtml(r.name)}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.packQty)}</td><td class="num">${fmt(r.correctedValue)}</td><td><span class="status-pill ${r.status}">${r.status}</span></td></tr>
  `).join('') : '<tr class="empty-row"><td colspan="6">No rows match.</td></tr>';
}
function renderBranchExportTableOnly(){
  renderApp();
}

function exportRetainMatrix(kind){
  const map = {};
  BRANCHES.forEach(b=>{
    (state.branchData[b].computed||[]).forEach(r=>{
      if(r.status!=='Retained') return;
      const key = (r.name||'').trim().toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = { display:r.name, values:{}, total:0 };
      map[key].values[b] = (map[key].values[b]||0) + r.correctedValue;
      map[key].total += r.correctedValue;
    });
  });
  const entries = Object.values(map).sort((a,b)=>b.total-a.total);
  if(!entries.length){ toast('No retained stock to export yet','error'); return; }
  if(kind==='xlsx'){
    const aoa = [['Product Name', ...BRANCHES, 'Total']];
    entries.forEach(e=>aoa.push([e.display, ...BRANCHES.map(b=>e.values[b]||0), e.total]));
    exportExcel(aoa, 'Consolidated Retain Stock', [36, ...BRANCHES.map(()=>10), 14], 'consolidated_retain_stock_'+todayStamp()+'.xlsx');
  } else {
    const body = entries.map(e=>[e.display, ...BRANCHES.map(b=>e.values[b]?fmt(e.values[b]):'—'), fmt(e.total)]);
    exportPdf('Consolidated Retain Stock', ['Product Name', ...BRANCHES, 'Total'], body, 'consolidated_retain_stock_'+todayStamp()+'.pdf');
  }
  toast('Consolidated retain stock exported');
}

function exportCommon(kind){
  const map = {};
  BRANCHES.forEach(b=>{
    (state.branchData[b].computed||[]).forEach(r=>{
      if(r.status!=='Excess' || r.correctedValue<=0) return;
      const key = (r.name||'').trim().toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = { display:r.name, values:{} };
      map[key].values[b] = (map[key].values[b]||0) + r.correctedValue;
    });
  });
  const entries = Object.values(map).map(e=>({...e, branchCount:Object.keys(e.values).length, total:Object.values(e.values).reduce((s,v)=>s+v,0)})).filter(e=>e.branchCount>=2).sort((a,b)=>b.total-a.total);
  if(!entries.length){ toast('No common products found yet','error'); return; }
  if(kind==='xlsx'){
    const aoa = [['Product Name', ...BRANCHES, 'Chain Total', '# Branches']];
    entries.forEach(e=>aoa.push([e.display, ...BRANCHES.map(b=>e.values[b]||0), e.total, e.branchCount]));
    exportExcel(aoa, 'Common Products', [36, ...BRANCHES.map(()=>10), 14, 10], 'common_products_'+todayStamp()+'.xlsx');
  } else {
    const body = entries.map(e=>[e.display, ...BRANCHES.map(b=>e.values[b]?fmt(e.values[b]):'—'), fmt(e.total), e.branchCount]);
    exportPdf('Common Products Across Branches', ['Product Name', ...BRANCHES, 'Chain Total', '# Br.'], body, 'common_products_'+todayStamp()+'.pdf');
  }
  toast('Common products report exported');
}

/* ============================================================
   HANDLERS: catalog / retain import / branch file / backup
============================================================ */
async function handleMasterFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  let byCode={}, byName={}, count=0;
  try{
    if(file.name.toLowerCase().endsWith('.json')){
      const arr = JSON.parse(text);
      arr.forEach(p=>{
        const code = String(p.code ?? p.Code ?? p.ProductCode ?? '').trim();
        const name = String(p.name ?? p.Name ?? p.ProductName ?? '').trim();
        const factor = Number(p.conversionFactor ?? p.factor ?? p.PackSize ?? p['Pur Con Factor'] ?? 1) || 1;
        if(code) byCode[code] = { name, factor };
        if(name) byName[name.toLowerCase()] = { name, factor };
        count++;
      });
    } else {
      const rows = parseDelimited(text);
      const headers = rows[0].map(h=>h.toLowerCase());
      const codeIdx = headers.findIndex(h=>h.includes('code'));
      const nameIdx = headers.findIndex(h=>h.includes('name'));
      const factorIdx = headers.findIndex(h=>h.includes('factor') || h.includes('pack'));
      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        if(!r || r.length<2) continue;
        const code = (r[codeIdx>=0?codeIdx:0]||'').trim();
        const name = (r[nameIdx>=0?nameIdx:1]||'').trim();
        const factor = Number(r[factorIdx>=0?factorIdx:2]) || 1;
        if(code) byCode[code] = { name, factor };
        if(name) byName[name.toLowerCase()] = { name, factor };
        count++;
      }
    }
  }catch(err){ toast('Could not parse catalog file','error'); return; }

  state.master = { byCode, byName, count, source:'custom' };
  persistMaster();
  recomputeAll(true);
  toast(count+' products loaded into catalog — all branches recalculated');
  renderApp();
}
function handleResetCatalog(){
  state.master = loadBaseCatalog();
  lsRemove('master-products');
  recomputeAll(true);
  toast('Reverted to built-in base catalog ('+state.master.count+' products)');
  renderApp();
}

async function addRetainItem(){
  const input = document.getElementById('retainInput');
  const val = input.value.trim();
  if(!val) return;
  const bd = state.branchData[state.activeBranch];
  if(!bd.retainList.some(x=>x.toLowerCase()===val.toLowerCase())){
    bd.retainList.push(val);
    recompute(state.activeBranch, true);
    renderApp();
  }
}
async function handleRetainImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  let names = [];
  try{
    if(file.name.toLowerCase().endsWith('.json')){
      const arr = JSON.parse(text);
      names = Array.isArray(arr) ? arr.map(String) : [];
    } else {
      names = text.replace(/\r/g,'').split('\n').map(l=>l.split(',')[0].trim()).filter(Boolean);
    }
  }catch(err){ toast('Could not parse that file','error'); return; }
  const bd = state.branchData[state.activeBranch];
  let added = 0;
  names.forEach(n=>{
    n = n.trim();
    if(n && !bd.retainList.some(x=>x.toLowerCase()===n.toLowerCase())){ bd.retainList.push(n); added++; }
  });
  recompute(state.activeBranch, true);
  toast(added+' item'+(added===1?'':'s')+' added to retain list');
  renderApp();
}

async function handleBranchFile(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    if(file.name.toLowerCase().endsWith('.csv')){
      const text = await file.text();
      applyDataRows(state.activeBranch, parseDelimited(text), file.name);
    } else {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''}).map(r=>r.map(c=>(c===null||c===undefined)?'':c));
      applyDataRows(state.activeBranch, rows, file.name);
    }
  }catch(err){
    console.error(err);
    toast('Could not read that file','error');
  }
}

function handleExportAll(){
  const bundle = { app:'excess-stock-control', exportedAt:new Date().toISOString(), master:state.master, branchData:state.branchData, settings:state.settings };
  const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'excess_stock_control_backup_'+todayStamp()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded — save it to your Dropbox folder');
}
async function handleImportAll(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const bundle = JSON.parse(text);
    if(!bundle || !bundle.branchData) throw new Error('bad file');
    if(bundle.master) state.master = bundle.master;
    BRANCHES.forEach(b=>{ state.branchData[b] = bundle.branchData[b] || emptyBranchData(); });
    if(bundle.settings) state.settings = Object.assign({defaultTopN:10}, bundle.settings);
    persistMaster(); persistSettings();
    recomputeAll(true);
    toast('Backup restored — every branch recalculated');
    renderApp();
  }catch(err){
    toast('Could not read that backup file','error');
  }
  e.target.value = '';
}
function handleResetAll(){
  if(!confirm('Reset all data on this device? This clears the catalog, every branch, and settings. This cannot be undone.')) return;
  BRANCHES.forEach(b=>lsRemove('branch-data:'+b));
  lsRemove('master-products');
  lsRemove('settings');
  state.master = loadBaseCatalog();
  state.settings = { defaultTopN:10 };
  BRANCHES.forEach(b=>{ state.branchData[b] = emptyBranchData(); });
  toast('All data reset');
  setView('branch', { activeBranch:'AIT', branchTab:'adjustments' });
}

/* ============================================================
   NAVIGATION DELEGATION (sidebar + hamburger; sidebar is rebuilt each render)
============================================================ */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='go-tools') setView('tools', { toolsTab: el.dataset.tab });
  else if(action==='go-branch') setView('branch', { activeBranch: el.dataset.branch });
  else if(action==='go-branch-tab') setView('branch', { activeBranch: el.dataset.branch, branchTab: el.dataset.tab });
  else if(action==='go-hq') setView('hq', { hqTab: el.dataset.tab });
});
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  state.sidebarOpen = !state.sidebarOpen;
  renderSidebar();
});
document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
  state.sidebarOpen = false;
  renderSidebar();
});

/* ============================================================
   INIT
============================================================ */
function init(){
  const savedMaster = lsGet('master-products');
  state.master = (savedMaster && savedMaster.count) ? Object.assign({source:'custom'}, savedMaster) : loadBaseCatalog();

  const savedSettings = lsGet('settings');
  if(savedSettings) state.settings = Object.assign({defaultTopN:10}, savedSettings);

  BRANCHES.forEach(b=>{
    const bd = lsGet('branch-data:'+b);
    state.branchData[b] = bd || emptyBranchData();
  });
  recomputeAll(false);
  if(!getLocalUpdatedAt()) touchLocalUpdatedAt();

  renderApp();
  initCloudSync();
}
/* ============================================================
   PWA — install prompt + service worker registration
============================================================ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.style.display = 'inline-flex';
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.style.display = 'none';
  toast('Installed — you can now launch this from your home screen');
});
document.getElementById('installAppBtn').addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installAppBtn').style.display = 'none';
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
  });
}

init();
